[metadata]
name = rimopy
version = 0.0.23
author = Group of Atmospheric Optics (GOA-UVa), Universidad de Valladolid
author_email = gaton@goa.uva.es
description = Implementation of the ROLO model, following RIMO’s implementation.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.com/javgat/rimopy
project_urls =
    Bug Tracker = https://gitlab.com/javgat/rimopy/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
include_package_data = True

install_requires = 
    numpy>=1.22.0
    scipy>=1.7.3
    spiceypy>=4.0.3

[options.packages.find]
where = src